// Run :fabric:runServer with -I tests/server-bootstrap.init.gradle.
// Isolate output and stop at the EULA gate; never accept it or open a world here.
gradle.afterProject { project ->
    if (project.name == 'neoforge') {
        project.tasks.named('runServer') {
            doFirst { throw new GradleException('NeoForge development bypasses the EULA gate; this bootstrap-only check supports Fabric only.') }
        }
    }
    if (project.name == 'fabric') {
        project.loom.runs.named('server') {
            runDir project.layout.buildDirectory.dir('server-bootstrap').get().asFile.absolutePath
            if (!getProgramArgs().contains('nogui')) programArg 'nogui'
        }
        project.tasks.named('runServer') {
            doFirst {
                def eula = project.layout.buildDirectory.file('server-bootstrap/eula.txt').get().asFile
                if (eula.exists() && eula.getText('UTF-8') =~ /(?m)^\s*eula\s*=\s*true\s*$/) {
                    throw new GradleException('Bootstrap check refuses an EULA-accepted directory; use a fresh test directory.')
                }
            }
        }
    }
}
