import org.apache.tools.ant.filters.ReplaceTokens
import java.time.Instant

architectury { common('fabric', 'neoforge') }

def buildConfigSources = layout.buildDirectory.dir('generated/sources/buildConfig')
def generateBuildConfig = tasks.register('generateBuildConfig', Copy) {
    inputs.property 'version', project.version.toString()
    inputs.property 'protocol', rootProject.mod_protocol_version
    from 'src/main/BuildConfigTemplate.java'
    into buildConfigSources.map { it.dir('cn/zbx1425/mtrsteamloco') }
    filter(ReplaceTokens, tokens: [version: project.version.toString(),
            protocol_version: rootProject.mod_protocol_version, build_time: Instant.now().epochSecond.toString()])
    rename 'BuildConfigTemplate.java', 'BuildConfig.java'
}
sourceSets.main.java.srcDir(buildConfigSources)
// Ignore a generated source left by historical builds without deleting local files.
sourceSets.main.java.exclude { it.file == file('src/main/java/cn/zbx1425/mtrsteamloco/BuildConfig.java') }
tasks.named('compileJava') { dependsOn generateBuildConfig }

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "dev.architectury:architectury:${rootProject.architectury_version}"
    api("me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}") { transitive = false }
}

// Keep focused checks independently runnable as well as part of the full build.

def compatibilityOs = org.gradle.internal.os.OperatingSystem.current()
def compatibilityNativeOs = compatibilityOs.isWindows() ? 'windows' : compatibilityOs.isMacOsX() ? 'macos' : 'linux'
def compatibilityNativeArch = System.getProperty('os.arch').contains('aarch64') ? '-arm64' : ''
def compatibilityNatives = configurations.detachedConfiguration(dependencies.create("org.lwjgl:lwjgl:3.4.1:natives-${compatibilityNativeOs}${compatibilityNativeArch}"))
tasks.withType(JavaExec).configureEach {
    workingDir = layout.buildDirectory.dir('compatibility-run').get().asFile
    doFirst { workingDir.mkdirs() }
}
def registrationClasses = layout.buildDirectory.dir('classes/registrationCompatibility')
def compileRegistration = tasks.register('compileRegistrationCompatibility', JavaCompile) {
    source '../tests/RegistrationCompatibilityCheck.java'
    classpath = configurations.compileClasspath
    destinationDirectory = registrationClasses
}
tasks.register('checkRegistrationCompatibility', JavaExec) {
    group = 'verification'
    dependsOn compileRegistration, rootProject.tasks.named('verifyMtrArtifacts')
    classpath = files(registrationClasses) + configurations.compileClasspath
    mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.RegistrationCompatibilityCheck'
    args rootProject.projectDir.absolutePath
}

def materialClasses = layout.buildDirectory.dir('classes/blazeMaterialCompatibility')
def compileMaterials = tasks.register('compileBlazeMaterialCompatibility', JavaCompile) {
    source 'src/main/java/cn/zbx1425/sowcer/shader/BlazeRenderType.java', '../tests/BlazeMaterialCompatibilityCheck.java'
    classpath = configurations.compileClasspath
    destinationDirectory = materialClasses
}
tasks.register('checkBlazeMaterialCompatibility', JavaExec) {
    group = 'verification'
    dependsOn compileMaterials
    classpath = files(materialClasses) + configurations.compileClasspath
    mainClass = 'cn.zbx1425.sowcer.shader.BlazeMaterialCompatibilityCheck'
}

tasks.register('checkCompatibility') {
    group = 'verification'
    description = 'Runs focused 26.2 migration checks; not a full build or game launch.'
    dependsOn 'checkRegistrationCompatibility', 'checkBlazeMaterialCompatibility'
}
tasks.named('check') { dependsOn 'checkCompatibility' }

