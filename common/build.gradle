def sowcerClasses = layout.buildDirectory.dir('classes/sowcerCompatibility')
def compileSowcer = tasks.register('compileSowcerCompatibility', JavaCompile) {
    dependsOn generateBuildConfig
    source fileTree('src/main/java') {
        include 'cn/zbx1425/sowcer/math/*.java', 'cn/zbx1425/sowcer/vertex/*.java',
                'cn/zbx1425/sowcer/object/*.java', 'cn/zbx1425/sowcer/model/*.java', 'cn/zbx1425/sowcer/batch/*.java',
                'cn/zbx1425/sowcer/shader/BlazeRenderType.java', 'cn/zbx1425/sowcer/shader/ShaderManager.java',
                'cn/zbx1425/sowcer/util/AttrUtil.java', 'cn/zbx1425/sowcer/util/DrawContext.java',
                'cn/zbx1425/sowcer/util/OffHeapAllocator.java', 'cn/zbx1425/sowcer/util/GlStateTracker.java',
                'cn/zbx1425/sowcerext/model/RawModel.java', 'cn/zbx1425/sowcerext/model/RawMesh.java',
                'cn/zbx1425/sowcerext/model/Vertex.java', 'cn/zbx1425/sowcerext/model/Face.java',
                'cn/zbx1425/sowcerext/model/integration/FaceList.java', 'cn/zbx1425/sowcerext/model/integration/BufferSourceProxy.java'
        include 'cn/zbx1425/sowcerext/model/ModelCluster.java', 'cn/zbx1425/sowcerext/model/loader/*.java',
                'cn/zbx1425/sowcerext/reuse/*.java', 'cn/zbx1425/sowcerext/util/*.java', 'de/javagl/obj/*.java',
                'cn/zbx1425/mtrsteamloco/scripting/util/client/DynamicModelHolder.java',
                'cn/zbx1425/mtrsteamloco/scripting/AbstractDrawCalls.java', 'cn/zbx1425/sowcer/ContextCapability.java',
                'cn/zbx1425/mtrsteamloco/mixin/GLFWMixin.java'
    }
    classpath = configurations.compileClasspath
    source buildConfigSources
    destinationDirectory = sowcerClasses
}
compileSowcer.configure { source '../tests/SowcerCompatibilityCheck.java' }
tasks.register('checkSowcerCompatibility', JavaExec) {
    group = 'verification'
    dependsOn compileSowcer
    classpath = files(sowcerClasses) + configurations.compileClasspath + compatibilityNatives
    mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.SowcerCompatibilityCheck'
}
tasks.named('checkCompatibility') { dependsOn 'checkSowcerCompatibility' }

