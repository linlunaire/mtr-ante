    destinationDirectory = railWeavingClasses
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
tasks.register('checkRailConstructorWeaving', JavaExec) {
    group = 'verification'
    description = 'Actually weaves and executes Rail Map, packet and legacy NBT constructors, preserving roll metadata.'
    dependsOn compileRailWeaving
