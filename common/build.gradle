            sourceSets.main.output.classesDirs) + configurations.compileClasspath
    mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.RailConstructorWeavingCheck'
    if (rootProject.hasProperty('railFixture')) args rootProject.property('railFixture')
}
tasks.named('check') { dependsOn 'checkRailConstructorWeaving' }

