plugins {
    id 'architectury-plugin' version '3.5.169'
    id 'dev.architectury.loom-no-remap' version '1.17.491' apply false
    id 'com.gradleup.shadow' version '9.2.2' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.20' apply false
}

if (JavaVersion.current() != JavaVersion.VERSION_25) throw new GradleException('ANTE 26.2 requires JDK 25.')
if (minecraft_version != '26.2') throw new GradleException('This project builds Minecraft 26.2 only.')
ext.mtrRoot = providers.gradleProperty('mtrProjectDir').map { file(it) }.getOrElse(file('../Minecraft-Transit-Railway-3.x.x'))
ext.transitCoreRoot = providers.gradleProperty('transitCoreProjectDir').map { file(it) }.getOrElse(file('../Kotlin-LunaCore').isDirectory() ? file('../Kotlin-LunaCore') : file('../Transit-Core'))
ext.transitCoreJar = new File(transitCoreRoot, "core/build/libs/transit-core-${transit_core_version}.jar")
def anteProperties = new Properties()
file('gradle.properties').withInputStream { anteProperties.load(it) }
def mtrProperties = new Properties()
new File(mtrRoot, 'gradle.properties').withInputStream { mtrProperties.load(it) }
ext.anteVersion = providers.gradleProperty('mod_version').get()
if (!(anteVersion ==~ /.+-26\.2(?:[-+].+)?/)) throw new GradleException('ANTE mod_version must target Minecraft 26.2.')
ext.mtrVersion = "26.2-${mtrProperties.getProperty('mod_version')}"
// Older pinned Java/Kotlin checkpoints still publish under the MTR name.
ext.mtrArchiveBaseName = mtrProperties.getProperty('archives_base_name', 'MTR')
ext.mtrCommonJar = new File(mtrRoot, "common/build/libs/common-${mtrVersion}-dev.jar")
architectury { minecraft = minecraft_version }

allprojects {
    apply plugin: 'architectury-plugin'
    group = anteProperties.getProperty('maven_group')
    version = rootProject.anteVersion
    repositories {
        mavenCentral()
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://neoforged.forgecdn.net/releases/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
    }
}

def verifyMtrArtifacts = tasks.register('verifyMtrArtifacts') {
    doLast {
        def artifacts = [rootProject.mtrCommonJar]
        ['fabric', 'neoforge'].each { artifacts.add(new File(rootProject.mtrRoot, "build/release/${rootProject.mtrArchiveBaseName}-${it}-${rootProject.mtrVersion}.jar")) }
        artifacts.each {
            if (!it.isFile()) throw new GradleException("Build the sibling MTR 26.2 project first; missing ${it}")
        }
    }
}

def verifyTransitCoreArtifacts = tasks.register('verifyTransitCoreArtifacts') {
    doLast {
        def artifacts = [rootProject.transitCoreJar]
        ['fabric', 'neoforge'].each {
            artifacts.add(new File(rootProject.transitCoreRoot, "build/release/Kotlin-LunaCore-${it}-26.2-${rootProject.transit_core_version}.jar"))
        }
        artifacts.each {
            if (!it.isFile()) throw new GradleException("Build the sibling Transit-Core project first; missing ${it}")
        }
    }
}

def releaseCheckClasses = layout.buildDirectory.dir('classes/releaseArtifactCompatibility')
def kotlinArtifactCheckClasses = layout.buildDirectory.dir('classes/kotlinCoreArtifactCheck')
tasks.register('compileKotlinMigrationAbiCheck', JavaCompile) {
    source new File(rootProject.mtrRoot, 'tests/KotlinMigrationAbiCheck.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/kotlinMigrationAbiCheck')
    options.encoding = 'UTF-8'
    options.release = 25
    sourceCompatibility = '25'
    targetCompatibility = '25'
}
tasks.register('compileKotlinCoreArtifactCheck', JavaCompile) {
    source new File(rootProject.mtrRoot, 'tests/KotlinCoreArtifactCheck.java')
    classpath = files()
    destinationDirectory = kotlinArtifactCheckClasses
    options.encoding = 'UTF-8'
    options.release = 25
    sourceCompatibility = '25'
    targetCompatibility = '25'
}
def releaseArchiveClass = new GroovyClassLoader(getClass().classLoader).parseClass(file('gradle/ReleaseArchive.groovy'))
def checkReleaseArchive = tasks.register('checkReleaseArchive') {
    group = 'verification'
    inputs.files('gradle/ReleaseArchive.groovy', 'tests/ReleaseArchiveCheck.groovy')
    doLast {
        new GroovyShell(getClass().classLoader, new Binding([args: [rootProject.projectDir.absolutePath] as String[]]))
                .evaluate(rootProject.file('tests/ReleaseArchiveCheck.groovy'))
    }
}
tasks.register('compileReleaseArtifactCompatibility', JavaCompile) {
    source 'tests/ReleaseArtifactCompatibilityCheck.java', 'tests/GraalModuleCompatibilityCheck.java'
    classpath = files()
    destinationDirectory = releaseCheckClasses
    options.encoding = 'UTF-8'
    options.release = 25
    sourceCompatibility = '25'
    targetCompatibility = '25'
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'com.gradleup.shadow'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    kotlin {
        jvmToolchain(25)
        coreLibrariesVersion = rootProject.kotlin_runtime_version
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
            jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.NO_COMPATIBILITY
            moduleName = "ante_${project.name}"
        }
    }
    loom { accessWidenerPath = rootProject.file('common/src/main/resources/mtrsteamloco.accesswidener') }
    java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
    configurations {
        shadowCommon
        kotlinArtifactRuntime { canBeConsumed = false }
        clothConfigJar
        anteRuntimeLibraries
        compileOnly.extendsFrom anteRuntimeLibraries
        runtimeOnly.extendsFrom anteRuntimeLibraries
        if (project.name != 'common') shadowCommon.extendsFrom anteRuntimeLibraries
    }
    dependencies {
        compileOnly files(rootProject.transitCoreJar)
        kotlinArtifactRuntime "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_runtime_version}"
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        compileOnly files(rootProject.mtrCommonJar)
        implementation 'org.joml:joml:1.10.8'
        implementation "org.msgpack:msgpack-core:${anteProperties.getProperty('messagepack_version')}"
        anteRuntimeLibraries 'com.github.stuxuhai:jpinyin:1.1.7'
        compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
        anteRuntimeLibraries "org.graalvm.polyglot:polyglot:${rootProject.graaljs_version}"
        // The aggregate js dependency contributes POMs that Loom tries to open as JARs.
        // Depend on the concrete language JAR; Truffle is declared separately below.
        anteRuntimeLibraries "org.graalvm.js:js-language:${rootProject.graaljs_version}"
        anteRuntimeLibraries "org.graalvm.truffle:truffle-runtime:${rootProject.graaljs_version}"
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
        options.compilerArgs += ['-Xmaxerrs', '1000']
    }
    tasks.named('compileJava') { dependsOn verifyMtrArtifacts, verifyTransitCoreArtifacts }
    tasks.named('compileKotlin') { dependsOn verifyMtrArtifacts, verifyTransitCoreArtifacts }
    processResources {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        inputs.file(rootProject.buildFile)
        inputs.property 'version', project.version
        inputs.property 'mtrVersion', rootProject.mtr_min_version
        inputs.property 'transitCoreVersion', rootProject.transit_core_version
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand version: project.version, mtrVersion: rootProject.mtr_min_version,
                    transitCoreVersion: rootProject.transit_core_version
        }
    }
    shadowJar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        configurations = [project.configurations.shadowCommon]
        archiveBaseName = "YLM-ANTE-${project.name}"
        archiveClassifier = ''
        mergeServiceFiles()
        filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
        manifest.attributes('Multi-Release': 'true')
        exclude 'module-info.class', 'META-INF/versions/**/module-info.class', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        exclude '*.bmp', '**/*.kotlin_metadata', '**/*.kotlin_builtins'
        relocate 'de.javagl', 'vendor.cn.zbx1425.sowcerext.de.javagl'
        relocate 'com.github.stuxuhai', 'vendor.cn.zbx1425.mtrsteamloco.com.github.stuxuhai'
        // GraalVM JDKs already export these SDK packages. FML makes ANTE an
        // automatic module, so flat copies cause JPMS split-package failures.
        // Keep the public Polyglot API and Truffle runtime/mixin targets intact.
        ['org.graalvm.word', 'org.graalvm.collections', 'org.graalvm.nativeimage',
         'com.oracle.svm.core.annotate', 'com.oracle.truffle.compiler'].each { sdkPackage ->
            relocate(sdkPackage, "cn.zbx1425.mtrsteamloco.vendor.graal.${sdkPackage}") {
                // Native Image's public system-property names are not class names.
                skipStringConstants = true
            }
        }
        from({ project.configurations.clothConfigJar.collect { zipTree(it) } }) {
            include 'me/shedaniel/clothconfig2/**', 'me/shedaniel/math/**', 'assets/cloth-config2/**'
        }
        relocate 'me.shedaniel', 'cn.zbx1425.mtrsteamloco.vendor.me.shedaniel'
    }
    if (project.name != 'common') {
        tasks.register('checkKotlinCoreArtifact', JavaExec) {
            group = 'verification'
            dependsOn ':compileKotlinCoreArtifactCheck', tasks.named('shadowJar')
            classpath = files(kotlinArtifactCheckClasses)
            mainClass = 'KotlinCoreArtifactCheck'
            doFirst {
                def runtime = configurations.kotlinArtifactRuntime.files.find {
                    it.name == "kotlin-stdlib-${rootProject.kotlin_runtime_version}.jar"
                }
                if (runtime == null) throw new GradleException('Missing shared Kotlin runtime for artifact check')
                args tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath, 'ante', runtime.absolutePath,
                        new File(rootProject.transitCoreRoot, "build/release/Kotlin-LunaCore-${project.name}-26.2-${rootProject.transit_core_version}.jar").absolutePath,
                        new File(rootProject.mtrRoot, "build/release/${rootProject.mtrArchiveBaseName}-${project.name}-${rootProject.mtrVersion}.jar").absolutePath
            }
        }
        tasks.register('checkPackagedKotlinMigration', JavaExec) {
            group = 'verification'
            description = 'Verifies migrated JVM contracts and Kotlin implementations in the actual release JAR.'
            dependsOn ':compileKotlinMigrationAbiCheck', tasks.named('shadowJar')
            classpath = files(rootProject.layout.buildDirectory.dir('classes/kotlinMigrationAbiCheck'))
            mainClass = 'KotlinMigrationAbiCheck'
            args 'check-packaged', rootProject.file('tests/kotlin-abi').absolutePath,
                    tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
        }
        tasks.register('checkPackagedRouteWeaving', JavaExec) {
            group = 'verification'
            description = 'Executes the actual Kotlin route mixin from the finished loader JAR against the matching MTR release.'
            dependsOn ':common:compileRouteWeaving', tasks.named('shadowJar')
            def mtrArtifact = new File(rootProject.mtrRoot, "build/release/${rootProject.mtrArchiveBaseName}-${project.name}-${rootProject.mtrVersion}.jar")
            def anteArtifact = tasks.named('shadowJar').get().archiveFile
            classpath = files(project(':common').layout.buildDirectory.dir('classes/routeWeaving'),
                    rootProject.file('tests/route-weaving/resources'), rootProject.file('tests/camera-weaving/resources'),
                    mtrArtifact, anteArtifact) + configurations.compileClasspath
            mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.RouteWeavingCheck'
            args rootProject.file('tests/fixtures/route-weaving-java-1.1.1-26.2.tsv').absolutePath,
                    mtrArtifact.absolutePath, anteArtifact.get().asFile.absolutePath
        }
        tasks.register('checkPackagedDepotWeaving', JavaExec) {
            group = 'verification'
            description = 'Runs depot path-generation goldens through actual DepotMixin injection in the finished loader JARs.'
            dependsOn ':common:compileDepotPathCompatibility', tasks.named('shadowJar')
            def mtrArtifact = new File(rootProject.mtrRoot, "build/release/${rootProject.mtrArchiveBaseName}-${project.name}-${rootProject.mtrVersion}.jar")
            def anteArtifact = tasks.named('shadowJar').get().archiveFile
            classpath = files(project(':common').layout.buildDirectory.dir('classes/depotPathCompatibility'),
                    rootProject.file('tests/depot-path/resources'), rootProject.file('tests/camera-weaving/resources'),
                    mtrArtifact, anteArtifact) + project(':common').configurations.compileClasspath
            mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.DepotPathCompatibilityCheck'
            args rootProject.file('tests/fixtures/depot-path-java-1.1.1-26.2.tsv').absolutePath,
                    anteArtifact.get().asFile.absolutePath, '--through-depot', '--packaged', '--check-plan', "--target=${mtrArtifact.absolutePath}"
        }
        tasks.register('checkPackagedRailWeaving', JavaExec) {
            group = 'verification'
            description = 'Checks extended Kotlin enum entries and rail/angle constructors from finished loader artifacts.'
            dependsOn ':common:compileRailConstructorWeaving', tasks.named('shadowJar')
            def mtrArtifact = new File(rootProject.mtrRoot, "build/release/${rootProject.mtrArchiveBaseName}-${project.name}-${rootProject.mtrVersion}.jar")
            def anteArtifact = tasks.named('shadowJar').get().archiveFile
            classpath = files(project(':common').layout.buildDirectory.dir('classes/railConstructorWeaving'),
                    rootProject.file('tests/rail-weaving/resources'), rootProject.file('tests/camera-weaving/resources'),
                    mtrArtifact, anteArtifact) + project(':common').configurations.compileClasspath
            mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.RailConstructorWeavingCheck'
            args '--packaged', mtrArtifact.absolutePath, anteArtifact.get().asFile.absolutePath
        }
        tasks.register('checkPackagedRailActionsWeaving', JavaExec) {
            group = 'verification'
            dependsOn ':common:compileRailActionsWeaving', tasks.named('shadowJar')
            def mtrArtifact = new File(rootProject.mtrRoot, "build/release/${rootProject.mtrArchiveBaseName}-${project.name}-${rootProject.mtrVersion}.jar")
            def anteArtifact = tasks.named('shadowJar').get().archiveFile
            classpath = files(project(':common').layout.buildDirectory.dir('classes/railActionsWeaving'),
                    rootProject.file('tests/rail-actions-weaving/resources'), rootProject.file('tests/camera-weaving/resources'),
                    mtrArtifact, anteArtifact) + project(':common').configurations.compileClasspath
            mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.RailActionsWeavingCheck'
            args new File(rootProject.mtrRoot, 'tests/fixtures/rail-actions-java-26.2-3.3.2.tsv').absolutePath,
                    mtrArtifact.absolutePath, anteArtifact.get().asFile.absolutePath
        }
        tasks.named('check') { dependsOn 'checkKotlinCoreArtifact', 'checkPackagedKotlinMigration', 'checkPackagedRouteWeaving', 'checkPackagedDepotWeaving', 'checkPackagedRailWeaving', 'checkPackagedRailActionsWeaving' }
        tasks.register('checkDevelopmentClasspath') {
            group = 'verification'
            inputs.files(configurations.runtimeClasspath)
            doLast {
                def names = configurations.runtimeClasspath.files.collect { it.name }
                ['polyglot-', 'js-language-', 'truffle-runtime-', 'jpinyin-'].each { library ->
                    if (!names.any { it.startsWith(library) && it.endsWith('.jar') }) {
                        throw new GradleException("Missing development runtime library: ${library}")
                    }
                }
                println "Verified ${project.name} development runtime resolution and script/search libraries."
            }
        }
        tasks.register('checkReleaseArtifactCompatibility', JavaExec) {
            group = 'verification'
            dependsOn ':compileReleaseArtifactCompatibility', tasks.named('shadowJar')
            classpath = files(releaseCheckClasses)
            mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.ReleaseArtifactCompatibilityCheck'
            doFirst { args tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath, project.name, project.version.toString() }
        }
        tasks.register('checkGraalModuleCompatibility', JavaExec) {
            group = 'verification'
            dependsOn ':compileReleaseArtifactCompatibility', tasks.named('shadowJar')
            classpath = files(releaseCheckClasses)
            mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.GraalModuleCompatibilityCheck'
            doFirst { args tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath }
        }
        tasks.named('check') { dependsOn 'checkReleaseArtifactCompatibility', 'checkDevelopmentClasspath', 'checkGraalModuleCompatibility' }
        def releaseJar = tasks.register('releaseJar', Copy) {
            dependsOn tasks.named('shadowJar'), tasks.named('check'), ':common:check', checkReleaseArchive
            from tasks.named('shadowJar').flatMap { it.archiveFile }
            into rootProject.layout.buildDirectory.dir('release')
            // Recheck stale files even when the current JAR itself is unchanged.
            outputs.upToDateWhen { false }
            doLast {
                def currentName = tasks.named('shadowJar').get().archiveFile.get().asFile.name
                releaseArchiveClass.archivePrevious(destinationDir, project.name, currentName).each {
                    logger.lifecycle("Archived previous ${project.name} 26.2 release: ${it}")
                }
            }
        }
        tasks.named('build') { dependsOn releaseJar }
    }
}

apply from: 'tests/camera-weaving/check.gradle'
