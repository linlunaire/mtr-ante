// Equivalent symbol moves only. Behavior changes belong in version-specific Java overlays.
rootProject.ext.transformAnte26Source = { String source ->
    def result = source.replace('\r\n', '\n')
        .replaceAll(/\bResourceLocation\b/, 'Identifier')
        .replaceAll(/\bGuiGraphics\b/, 'GuiGraphicsExtractor')
        .replaceAll(/\breadResourceLocation\b/, 'readIdentifier')
        .replaceAll(/\bwriteResourceLocation\b/, 'writeIdentifier')
        .replace('net.minecraft.Util', 'net.minecraft.util.Util')
        .replace('net.minecraft.client.renderer.RenderType', 'net.minecraft.client.renderer.rendertype.RenderType')
        .replace('net.minecraft.client.renderer.LightTexture', 'net.minecraft.util.LightCoordsUtil')
        .replaceAll(/\bLightTexture\b/, 'LightCoordsUtil')
        .replace('.dimension().location()', '.dimension().identifier()')
        .replace('Minecraft.getInstance().setScreen(', 'Minecraft.getInstance().gui.setScreen(')
        .replace('Minecraft.getInstance().screen', 'Minecraft.getInstance().gui.screen()')
        .replace('Minecraft.getInstance().gameRenderer.getMainCamera()', 'Minecraft.getInstance().gameRenderer.mainCamera()')
        .replace('Minecraft.getInstance().gameRenderer.mainCamera().getPosition()', 'Minecraft.getInstance().gameRenderer.mainCamera().position()')
    if (source.contains('package cn.zbx1425.mtrsteamloco.')) {
        // All reviewed field receivers are Level/ClientLevel/ServerLevel; the method form also exists in shared code.
        result = result.replaceAll(/\.isClientSide\b(?!\s*\()/, '.isClientSide()')
                .replaceAll(/\b(player|sp)\.displayClientMessage\(([^\r\n]*), true\);/, '$1.sendOverlayMessage($2);')
    }
    if (source.contains('Minecraft minecraftClient')) {
        result = result.replace('minecraftClient.setScreen(', 'minecraftClient.gui.setScreen(')
    }
    if (source.contains('package cn.zbx1425.mtrsteamloco.gui;') || source.contains('package cn.zbx1425.mtrsteamloco.gui.entries;')) {
        // GUI-owned Minecraft receivers and typed widgets only; ScreenMapper/custom render methods stay intact.
        result = result.replace('minecraft.setScreen(', 'minecraft.gui.setScreen(')
                .replace('Minecraft.getInstance().tell(', 'Minecraft.getInstance().schedule(')
                .replace('Minecraft.getInstance().levelRenderer.allChanged()', 'Minecraft.getInstance().levelExtractor.allChanged()')
        def widgets = source =~ /\b(?:Button|AbstractWidget|EditBox|WidgetBetterTextField|WidgetSlider|WidgetLabel)\s+(\w+)/
        widgets.each { match -> result = result.replace("${match[1]}.render(", "${match[1]}.extractRenderState(") }
        def graphics = source =~ /\bGuiGraphics\s+(\w+)/
        graphics.each { match ->
            result = result.replace("${match[1]}.drawString(", "${match[1]}.text(")
                    .replace("${match[1]}.drawCenteredString(", "${match[1]}.centeredText(")
        }
        // Cloth's ten-argument entry hook, not ScreenMapper's four-argument compatibility hook.
        result = result.replace('void render(GuiGraphicsExtractor matrices, int index, int y, int x, int entryWidth, int entryHeight, int mouseX, int mouseY, boolean isHovered, float delta)',
                'void extractRenderState(GuiGraphicsExtractor matrices, int index, int y, int x, int entryWidth, int entryHeight, int mouseX, int mouseY, boolean isHovered, float delta)')
                .replace('super.render(matrices, index, y, x, entryWidth, entryHeight, mouseX, mouseY, isHovered, delta)',
                        'super.extractRenderState(matrices, index, y, x, entryWidth, entryHeight, mouseX, mouseY, isHovered, delta)')
        ['DirectNodeScreen', 'RoutePathCreatorScreen'].each { screen ->
            if (source.contains("public class ${screen} extends Screen")) {
                result = result.replace('void render(GuiGraphicsExtractor ', 'void extractRenderState(GuiGraphicsExtractor ')
                        .replace('super.render(ctx, mouseX, mouseY, partialTick)', 'super.extractRenderState(ctx, mouseX, mouseY, partialTick)')
            }
        }
    }
    if (source.contains('package cn.zbx1425.sowcerext.model.integration;') &&
            (source.contains('public class BufferSourceProxy {') || source.contains('public class FaceList {'))) {
        // These CPU batches only emit vertices. Capture through MTR's extraction scope;
        // do not route old world/GUI render hooks here until their lifecycle is ported.
        result = result.replace('net.minecraft.client.renderer.MultiBufferSource', 'mtr.mappings.RenderBufferSource')
                .replaceAll(/\bMultiBufferSource\b/, 'RenderBufferSource')
    }
    if (result.contains('package cn.zbx1425.mtrsteamloco;') && result.contains('public class MainClient {')) {
        // The MTR selected property now dispatches through generated client-item definitions.
        ['BRIDGE_CREATOR_1', 'COMPOUND_CREATOR'].each { item ->
            def legacy = "RegistryClient.registerItemModelPredicate(\"mtr:selected\", Main.${item}.get(), ItemBlockClickingBase.TAG_POS);"
            if (result.count(legacy) != 1) throw new GradleException("Review the ANTE selected-item hook for ${item}")
            result = result.replace(legacy, '// Selection is defined by assets/mtrsteamloco/items in 26.2.')
        }
    }
    return result
}
