// Item.use now returns InteractionResult; item tooltips emit to a Consumer.
// Keep these behavioral adaptations separate from generic API symbol moves.
rootProject.ext.transformAnte26ItemSource = { String source ->
    if (!source.contains('package cn.zbx1425.mtrsteamloco.item;') &&
            !(source.contains('package cn.zbx1425.mtrsteamloco.mixin;') && source.contains('class ItemRailModifierMixin '))) return source
    def result = source.replace('\r\n', '\n')
            .replace('import net.minecraft.world.InteractionResultHolder;', '')
            .replace('InteractionResultHolder<ItemStack>', 'net.minecraft.world.InteractionResult')
    // These reviewed calls return the same hand stack. Success explicitly preserves its replacement value.
    result = result.replaceAll(/InteractionResultHolder\.success\((stack|itemStack)\)/, 'net.minecraft.world.InteractionResult.SUCCESS.heldItemTransformedTo($1)')
            .replaceAll(/InteractionResultHolder\.pass\((stack|itemStack)\)/, 'net.minecraft.world.InteractionResult.PASS')
    def signature = 'public void appendHoverText(ItemStack stack, net.minecraft.world.item.Item.TooltipContext tooltipContext, List<Component> list, TooltipFlag flag) {'
    if (result.contains(signature)) {
        int start = result.indexOf(signature)
        int end = result.indexOf('\n    }', start)
        if (end < 0) throw new GradleException('Review ANTE item tooltip method boundary')
        def body = result.substring(start + signature.length(), end)
        def updated = 'public void appendHoverText(ItemStack stack, net.minecraft.world.item.Item.TooltipContext tooltipContext, net.minecraft.world.item.component.TooltipDisplay tooltipDisplay, java.util.function.Consumer<Component> list, TooltipFlag flag) {'
        result = result.substring(0, start) + updated + body.replace('list.add(', 'list.accept(') + result.substring(end)
    }
    if (result.contains('class DisplacementTool ')) {
        // The old overload teleported to absolute coordinates/rotation and did not reset the camera.
        result = result.replace('sp.teleportTo(sw, t.x, t.y, t.z, player.getYRot() + fr, player.getXRot())',
                'sp.teleportTo(sw, t.x, t.y, t.z, java.util.Set.of(), player.getYRot() + fr, player.getXRot(), false)')
    }
    return result
}
