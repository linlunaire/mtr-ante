def commonProject = project(':common')
def weavingClasses = commonProject.layout.buildDirectory.dir('classes/cameraWeaving')
def compileWeaving = commonProject.tasks.register('compileCameraWeaving', JavaCompile) {
    source rootProject.file('tests/camera-weaving/CameraWeavingCheck.java')
    classpath = commonProject.configurations.compileClasspath
    destinationDirectory = weavingClasses
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-proc:none']
}

['fabric', 'neoforge'].each { loader ->
    def loaderProject = project(":${loader}")
    loaderProject.tasks.register('checkCameraWeaving', JavaExec) {
        group = 'verification'
        dependsOn compileWeaving, ':common:compileJava'
        // Never append common's vanilla Minecraft classpath to the NeoForge run.
        classpath = files(weavingClasses, rootProject.file('tests/camera-weaving/resources'),
                commonProject.sourceSets.main.output.classesDirs) + loaderProject.configurations.compileClasspath
        mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.CameraWeavingCheck'
        args loader
    }
    loaderProject.tasks.named('check') { dependsOn 'checkCameraWeaving' }
}

project(':neoforge').tasks.register('checkMixinTargetCompatibility', JavaExec) {
    group = 'verification'
    dependsOn ':common:compileMixinTargetCompatibility', ':common:compileJava'
    classpath = files(commonProject.layout.buildDirectory.dir('classes/mixinTargetCompatibility'),
            commonProject.sourceSets.main.output.classesDirs) + project(':neoforge').configurations.compileClasspath
    mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.MixinTargetCompatibilityCheck'
    args rootProject.file('common/src/main/resources/mtrsteamloco.mixins.json').absolutePath
}
project(':neoforge').tasks.named('check') { dependsOn 'checkMixinTargetCompatibility' }
