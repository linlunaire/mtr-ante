// Run with: gradlew help -Version=26.2 -I tests/jar-classpath.init.gradle
// Loom scans these resolved artifacts as ZIP file systems before tasks can run.
gradle.beforeProject { project ->
    project.configurations.configureEach { configuration ->
        if (configuration.name == 'mainCompileDependencyResolve') {
            configuration.incoming.afterResolve {
                def artifacts = configuration.incoming.artifacts.artifactFiles.files
                artifacts.findAll { it.isFile() }.each { artifact ->
                    if (!artifact.name.endsWith('.jar')) {
                        throw new GradleException("Non-JAR on Loom's ${project.path} compile scan: ${artifact.name}")
                    }
                    new java.util.jar.JarFile(artifact).close()
                }
                println "Verified ${project.path} Loom compile archives (${artifacts.size()} entries)."
            }
        }
    }
}
