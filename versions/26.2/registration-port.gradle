// Main.init owns the save-compatible ANTE identifiers. MTR's path-based
// RegistryObject constructor always uses the mtr namespace, so do not use it here.
def registrationIds = [:]
def initializer = new File(rootProject.sharedRoot, 'common/src/main/java/cn/zbx1425/mtrsteamloco/Main.java').getText('UTF-8')
(initializer =~ /registries\.register(?:BlockAndItem|Block|Item)\("([^"]+)",\s*([A-Z0-9_]+)/).each { match ->
    def previous = registrationIds.put(match[2], match[1])
    if (previous != null && previous != match[1]) {
        throw new GradleException("Conflicting ANTE registration identifiers for ${match[2]}")
    }
}

def replaceOnce = { String source, String before, String after ->
    if (source.count(before) != 1) throw new GradleException("Review the ANTE 26.2 registration hook: ${before}")
    source.replace(before, after)
}

rootProject.ext.transformAnte26RegistrationSource = { String source ->
    def result = source
    if (result.contains('package cn.zbx1425.mtrsteamloco;') && result.contains('public class Main {')) {
        def transformedIds = [:]
        result = result.replaceAll(/(RegistryObject<(?:Block|Item|ItemWithCreativeTabBase)>\s+([A-Z0-9_]+)\s*=\s*)new RegistryObject<>\(([^\r\n]+)\);/) { match, declaration, field, supplier ->
            def path = registrationIds[field]
            if (path == null) throw new GradleException("Missing explicit ANTE registration identifier for ${field}")
            transformedIds[field] = path
            return "${declaration}new RegistryObject<>(() -> mtr.mappings.RegistrationContext.construct(net.minecraft.resources.Identifier.fromNamespaceAndPath(MOD_ID, \"${path}\"), ${supplier}));"
        }
        if (transformedIds != registrationIds) {
            throw new GradleException('Not all ANTE block/item suppliers received an explicit registration context.')
        }
        result = replaceOnce(result, 'public static void init(RegistriesWrapper registries) {', '''public static void init(RegistriesWrapper registries) {
		mtr.mappings.NetworkUtilities.registerServerS2CTypes(dev.architectury.platform.Platform.getEnvironment(),
				PacketVersionCheck.PACKET_VERSION_CHECK, PacketScreen.PACKET_SHOW_SCREEN, PacketRoutePathCreator.ROUTE_S2C);''')
    }
    if (result.contains('package cn.zbx1425.mtrsteamloco.item;')) {
        if (result.contains('public class BlockItemEyeCandy extends BlockItem {')) {
            result = replaceOnce(result, 'RegistryUtilities.createItemProperties(() -> Main.EYE_CANDY_TAB)',
                "mtr.mappings.RegistrationContext.blockItemProperties(net.minecraft.resources.Identifier.fromNamespaceAndPath(Main.MOD_ID, \"${registrationIds.ITEM_EYE_CANDY}\"), block)")
        }
        if (result.contains('public class BlockItemDirectNode extends BlockItem {')) {
            result = replaceOnce(result, 'RegistryUtilities.createItemProperties(creativeModeTab::get)',
                "mtr.mappings.RegistrationContext.blockItemProperties(net.minecraft.resources.Identifier.fromNamespaceAndPath(cn.zbx1425.mtrsteamloco.Main.MOD_ID, \"${registrationIds.ITEM_DIRECT_NODE}\"), block)")
        }
    }
    if ((result.contains('package cn.zbx1425.mtrsteamloco.fabric;') || result.contains('package cn.zbx1425.mtrsteamloco.forge;')) && result.contains('public class RegistriesWrapperImpl implements RegistriesWrapper {')) {
        result = replaceOnce(result, 'new BlockItem(block.get(), RegistryUtilities.createItemProperties(tab::get))',
            'new BlockItem(block.get(), mtr.mappings.RegistrationContext.blockItemProperties(net.minecraft.resources.Identifier.fromNamespaceAndPath(Main.MOD_ID, id), block.get()))')
    }
    return result
}
