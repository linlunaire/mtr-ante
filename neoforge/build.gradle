import java.lang.module.ModuleFinder

architectury {
    platformSetupLoomIde()
    neoForge()
}

// Use only FML itself, not the entire development classpath: the script engine
// must come from the finished release JAR inside a real named module layer.
def fmlCheckLoader = configurations.runtimeClasspath.filter { it.name.startsWith('loader-') && it.name.endsWith('.jar') }
def fmlCheckClasses = layout.buildDirectory.dir('classes/fmlModuleCompatibility')
tasks.register('compileFmlModuleCompatibility', JavaCompile) {
    source rootProject.file('tests/FmlModuleDescriptorCheck.java')
    classpath = fmlCheckLoader
    destinationDirectory = fmlCheckClasses
    options.encoding = 'UTF-8'
    options.release = 25
}
tasks.register('checkFmlModuleCompatibility', JavaExec) {
    group = 'verification'
    dependsOn 'compileFmlModuleCompatibility', 'shadowJar'
    classpath = files(fmlCheckClasses) + fmlCheckLoader
    mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.FmlModuleDescriptorCheck'
    def sdkModules = ['org.graalvm.word', 'org.graalvm.collections', 'org.graalvm.nativeimage', 'org.graalvm.truffle.compiler']
            .findAll { ModuleFinder.ofSystem().find(it).isPresent() }
    if (!sdkModules.empty) jvmArgs '--add-modules', sdkModules.join(',')
    doFirst { args tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath }
}
tasks.named('check') { dependsOn 'checkFmlModuleCompatibility' }
// Keep common classes in Architectury's transformed development module, avoiding
// duplicate exported packages in NeoForge's module layer.
processResources {
    from(project(':common').file('src/main/resources')) {
        include 'mtrsteamloco.accesswidener', 'mtrsteamloco.mixins.json'
    }
}
configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}
dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    api "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    implementation files(new File(rootProject.mtrRoot, "build/release/MTR-neoforge-${rootProject.mtrVersion}.jar"))
    common(project(':common')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
    api("me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}") { transitive = false }
    clothConfigJar("me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}") { transitive = false }
    clothConfigJar('me.shedaniel.cloth:basic-math:0.6.1') { transitive = false }
}
