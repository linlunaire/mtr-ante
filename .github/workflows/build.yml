name: Build

on:
  push:
    branches: [master, '1.21.1']
    tags: ['1.1.1-1.21.1-*']
  pull_request:
    branches: [master, '1.21.1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YLTE
        uses: actions/checkout@v5
        with:
          path: mtr-ante
      - name: Checkout pinned YanlingMTR 1.0.0
        uses: actions/checkout@v5
        with:
          repository: linlunaire/Minecraft-Transit-Railway
          ref: ed05fd46864d5c2ac399b22cbb1dd5e92b833f82
          path: Minecraft-Transit-Railway-1.21.1
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Build MTR dependency
        working-directory: Minecraft-Transit-Railway-1.21.1
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Build YLTE Fabric and NeoForge
        working-directory: mtr-ante
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YLTE-1.21.1
          path: mtr-ante/build/release/YLTE-*-1.21.1-*.jar
          if-no-files-found: error
