def ridingStateClasses = layout.buildDirectory.dir('classes/ridingStateWeaving')
tasks.register('compileRidingStateWeaving', JavaCompile) {
    dependsOn tasks.named('classes')
    source rootProject.file('tests/riding-state-weaving/RidingStateWeavingCheck.java'),
            rootProject.file('tests/riding-state-weaving/fixtures'),
            rootProject.file('tests/camera-weaving/CameraWeavingCheck.java')
    classpath = configurations.compileClasspath
    destinationDirectory = ridingStateClasses
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
tasks.register('checkRidingStateWeaving', JavaExec) {
    group = 'verification'
    dependsOn 'compileRidingStateWeaving'
    classpath = files(ridingStateClasses, rootProject.file('tests/riding-state-weaving/resources'),
            rootProject.file('tests/camera-weaving/resources')) + sourceSets.main.output + configurations.compileClasspath
    mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.RidingStateWeavingCheck'
}
tasks.named('check') { dependsOn 'checkRidingStateWeaving' }

def commonProject = project
['fabric', 'neoforge'].each { platform ->
    def loaderProject = rootProject.project(":${platform}")
    loaderProject.tasks.register('checkPackagedRidingStateWeaving', JavaExec) {
        group = 'verification'
        dependsOn ':common:compileRidingStateWeaving', loaderProject.tasks.named('shadowJar')
        def artifact = loaderProject.tasks.named('shadowJar').flatMap { it.archiveFile }
        def mtrArtifact = new File(rootProject.mtrRoot, "build/release/MTR-${platform}-${rootProject.mtrVersion}.jar")
        // Only the nullable Minecraft.player fixture comes first. Production target
        // and mixin bytecode must come from the finished artifacts, checked below.
        classpath = loaderProject.files(ridingStateClasses, artifact, mtrArtifact,
                rootProject.file('tests/riding-state-weaving/resources'), rootProject.file('tests/camera-weaving/resources')) +
                commonProject.configurations.compileClasspath + loaderProject.configurations.kotlinArtifactRuntime
        mainClass = 'cn.zbx1425.mtrsteamloco.compatibility.RidingStateWeavingCheck'
        workingDir = loaderProject.layout.buildDirectory.dir('riding-state-weaving-run').get().asFile
        doFirst { workingDir.mkdirs() }
        args '--packaged', mtrArtifact.absolutePath, artifact.get().asFile.absolutePath
    }
    loaderProject.tasks.named('check') { dependsOn 'checkPackagedRidingStateWeaving' }
}
